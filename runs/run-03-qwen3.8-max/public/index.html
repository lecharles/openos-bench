<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OpenOS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a84ff'/%3E%3Crect x='6' y='7' width='20' height='14' rx='2.5' fill='%23fff'/%3E%3Crect x='12' y='23' width='8' height='2' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/window.css">
<link rel="stylesheet" href="css/apps.css">
</head>
<body>
<div id="boot">
  <div class="boot-inner">
    <svg class="boot-logo" viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="blogo" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
        </linearGradient>
      </defs>
      <circle cx="60" cy="60" r="34" fill="none" stroke="url(#blogo)" stroke-width="7"/>
      <circle cx="60" cy="60" r="16" fill="url(#blogo)"/>
      <path d="M60 12v18M60 90v18M12 60h18M90 60h18" stroke="url(#blogo)" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <div class="boot-bar"><div class="boot-bar-fill" id="boot-fill"></div></div>
    <div class="boot-label">OpenOS</div>
  </div>
</div>

<div id="desktop-root" aria-hidden="true">
  <div id="wallpaper" data-wp="sonoma"></div>
  <div id="desktop-icons"></div>
  <div id="windows-layer"></div>
  <div id="snap-preview"></div>
  <header id="menubar">
    <div id="mb-left"></div>
    <div id="mb-right"></div>
  </header>
  <div id="dock-wrap"><div id="dock"></div></div>
  <div id="spotlight" data-open="false">
    <div class="sp-card">
      <div class="sp-search">
        <svg viewBox="0 0 20 20" class="sp-glass"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12.8 12.8 L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="spotlight-input" type="text" placeholder="Spotlight Search" autocomplete="off" spellcheck="false" aria-label="Spotlight search">
      </div>
      <div id="spotlight-results"></div>
    </div>
  </div>
  <div id="context-menu" data-open="false"></div>
  <div id="control-center" data-open="false"></div>
  <div id="toasts"></div>
  <div id="lock-screen" data-on="false">
    <div class="lock-clock" id="lock-clock">3:58</div>
    <div class="lock-date" id="lock-date">Wednesday, November 19</div>
    <div class="lock-hint">Click or press any key to unlock</div>
  </div>
  <div id="brightness-layer"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
