</head>

  <div id="wallpaper" aria-hidden="true"><div class="wallpaper-orb orb-one"></div><div class="wallpaper-orb orb-two"></div><div class="wallpaper-ridge ridge-back"></div><div class="wallpaper-ridge ridge-front"></div><div class="wallpaper-grain"></div></div>

  <header id="menu-bar" aria-label="Menu bar">
    <nav class="menu-left" aria-label="Application menus">
      <button class="menu-button apple-menu-button" data-menu="apple" aria-label="Apple menu"><svg><use href="#i-apple"/></svg></button>
      <button class="menu-button app-menu-name" data-menu="app">Finder</button>
      <button class="menu-button desktop-menu" data-menu="file">File</button>
      <button class="menu-button desktop-menu" data-menu="edit">Edit</button>
      <button class="menu-button desktop-menu" data-menu="view">View</button>
      <button class="menu-button desktop-menu" data-menu="go">Go</button>
      <button class="menu-button desktop-menu" data-menu="window">Window</button>
      <button class="menu-button desktop-menu" data-menu="help">Help</button>
    </nav>
    <div class="menu-right">
      <button class="menu-button status-item battery-button" id="battery-button" aria-label="Battery"><span class="battery-percent">100%</span><svg><use href="#i-battery"/></svg></button>
      <button class="menu-button status-item" data-menu="wifi" aria-label="Wi-Fi"><svg><use href="#i-wifi"/></svg></button>
      <button class="menu-button status-item" id="spotlight-button" aria-label="Spotlight Search"><svg><use href="#i-search"/></svg></button>
      <button class="menu-button status-item" id="control-button" aria-label="Control Center"><svg><use href="#i-control"/></svg></button>
      <button class="menu-button" id="clock-button" aria-label="Notification Center"><span id="menu-clock">Thu Nov 26&nbsp; 9:41 AM</span></button>
    </div>
  </header>

  <main id="desktop" aria-label="Desktop">
    <div id="desktop-icons">
      <button class="desktop-icon" data-desktop-action="disk"><span class="disk-icon"><span></span></span><span class="desktop-label">Macintosh HD</span></button>
      <button class="desktop-icon" data-desktop-action="documents"><span class="desktop-folder"><svg><use href="#i-folder"/></svg></span><span class="desktop-label">Documents</span></button>
      <button class="desktop-icon" data-desktop-action="welcome"><span class="desktop-document"><span>Welcome to</span><strong>OpenOS</strong><i></i><i></i><i></i></span><span class="desktop-label">About OpenOS.txt</span></button>
    </div>
    <div id="windows" aria-live="polite"></div>
    <section id="desktop-widget" class="desktop-widget" aria-label="Weather widget">
      <div class="widget-heading"><span>San Francisco</span><svg><use href="#i-cloud"/></svg></div>
      <div class="widget-temp">18°</div><div class="widget-condition">Partly Cloudy</div>
      <div class="widget-range">H:21° &nbsp; L:13°</div>
    </section>
    <div id="desktop-selection" hidden></div>
  </main>

  <div id="dock-area">
    <div id="dock-label" hidden></div>
    <nav id="dock" aria-label="Dock">
      <button class="dock-item running" data-app="finder" aria-label="Finder"><span class="dock-tooltip">Finder</span><span class="dock-icon app-icon icon-finder"><svg><use href="#i-finder"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-action="launchpad" aria-label="Launchpad"><span class="dock-tooltip">Launchpad</span><span class="dock-icon app-icon icon-launchpad"><svg><use href="#i-launchpad"/></svg></span></button>
      <span class="dock-separator"></span>
      <button class="dock-item" data-app="notes" aria-label="Notes"><span class="dock-tooltip">Notes</span><span class="dock-icon app-icon icon-notes"><svg><use href="#i-notes"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="calendar" aria-label="Calendar"><span class="dock-tooltip">Calendar</span><span class="dock-icon app-icon icon-calendar"><span class="calendar-icon-day">26</span><svg><use href="#i-calendar"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="photos" aria-label="Photos"><span class="dock-tooltip">Photos</span><span class="dock-icon app-icon icon-photos"><svg><use href="#i-photos"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="music" aria-label="Music"><span class="dock-tooltip">Music</span><span class="dock-icon app-icon icon-music"><svg><use href="#i-music"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="mail" aria-label="Mail"><span class="dock-tooltip">Mail</span><span class="dock-icon app-icon icon-mail"><svg><use href="#i-mail"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="contacts" aria-label="Contacts"><span class="dock-tooltip">Contacts</span><span class="dock-icon app-icon icon-contacts"><svg><use href="#i-contacts"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="weather" aria-label="Weather"><span class="dock-tooltip">Weather</span><span class="dock-icon app-icon icon-weather"><svg><use href="#i-weather"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="clock" aria-label="Clock"><span class="dock-tooltip">Clock</span><span class="dock-icon app-icon icon-clock"><svg><use href="#i-clock"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="calculator" aria-label="Calculator"><span class="dock-tooltip">Calculator</span><span class="dock-icon app-icon icon-calculator"><svg><use href="#i-calculator"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="textedit" aria-label="TextEdit"><span class="dock-tooltip">TextEdit</span><span class="dock-icon app-icon icon-textedit"><svg><use href="#i-textedit"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="terminal" aria-label="Terminal"><span class="dock-tooltip">Terminal</span><span class="dock-icon app-icon icon-terminal"><svg><use href="#i-terminal"/></svg></span><i class="running-dot"></i></button>
      <button class="dock-item" data-app="settings" aria-label="System Settings"><span class="dock-tooltip">System Settings</span><span class="dock-icon app-icon icon-settings"><svg><use href="#i-settings"/></svg></span><i class="running-dot"></i></button>
      <span class="dock-separator"></span>
      <button class="dock-item" data-app="trash" aria-label="Trash"><span class="dock-tooltip">Trash</span><span class="dock-icon app-icon icon-trash"><svg><use href="#i-trash"/></svg></span><i class="running-dot"></i></button>
    </nav>
  </div>

  <section id="spotlight" class="system-overlay" hidden aria-label="Spotlight Search">
    <div class="spotlight-panel">
      <div class="spotlight-input-row"><svg><use href="#i-search"/></svg><input id="spotlight-input" type="text" autocomplete="off" spellcheck="false" placeholder="Spotlight Search" aria-label="Spotlight Search"><kbd>esc</kbd></div>
      <div id="spotlight-results" class="spotlight-results"></div>
      <footer class="spotlight-footer"><span>OpenOS</span><span><kbd>↑</kbd><kbd>↓</kbd> to navigate &nbsp; <kbd>↵</kbd> to open</span></footer>
    </div>
  </section>

  <section id="launchpad" class="system-overlay" hidden aria-label="Launchpad">
    <div class="launchpad-inner"><div class="launchpad-search"><svg><use href="#i-search"/></svg><input id="launchpad-input" placeholder="Search" aria-label="Search applications"></div><div id="launchpad-grid"></div><div class="launchpad-pages"><i class="active"></i><i></i></div></div>
  </section>

  <section id="control-center" class="floating-panel" hidden aria-label="Control Center">
    <div class="control-grid">
      <div class="control-connectivity control-card"><button class="control-toggle active" data-toggle="wifi"><span><svg><use href="#i-wifi"/></svg></span><div><strong>Wi-Fi</strong><small>OpenOS Network</small></div></button><button class="control-toggle active" data-toggle="bluetooth"><span class="bluetooth-glyph">ᛒ</span><div><strong>Bluetooth</strong><small>On</small></div></button><button class="control-toggle active" data-toggle="airdrop"><span><svg><use href="#i-share"/></svg></span><div><strong>AirDrop</strong><small>Contacts Only</small></div></button></div>
      <button class="control-card focus-card" data-toggle="focus"><span class="round-control"><svg><use href="#i-moon"/></svg></span><div><strong>Focus</strong><small>Off</small></div></button>
      <button class="control-card theme-card" data-toggle="theme"><span class="round-control"><svg><use href="#i-sun"/></svg></span><div><strong>Appearance</strong><small>Light</small></div></button>
      <div class="control-card slider-card"><label><svg><use href="#i-sun"/></svg> Display</label><input type="range" min="45" max="100" value="100" id="brightness-slider"></div>
      <div class="control-card slider-card"><label><svg><use href="#i-volume"/></svg> Sound</label><input type="range" min="0" max="100" value="65" id="volume-slider"></div>
    </div>
  </section>

  <aside id="notification-center" class="floating-panel" hidden aria-label="Notification Center"><div class="notification-date"><span id="notification-weekday">Thursday</span><h2 id="notification-date">November 26</h2></div><div class="notification-summary"><strong>Your day at a glance</strong><span id="notification-events">A clear day ahead.</span><button data-open-app="calendar">Open Calendar <svg><use href="#i-chevron"/></svg></button></div><div class="notification-card"><span class="mini-app-icon icon-notes"><svg><use href="#i-notes"/></svg></span><div><strong>Welcome to OpenOS</strong><p>Your ideas, files, and windows are saved automatically.</p><small>now</small></div></div></aside>

  <div id="menu-dropdown" class="menu-dropdown" hidden></div>
  <div id="context-menu" class="context-menu" hidden></div>
  <div id="toast-stack" aria-live="polite"></div>
  <div id="dialog-layer" hidden></div>
  <div id="brightness-dimmer" aria-hidden="true"></div>

  <div id="boot-screen"><svg><use href="#i-apple"/></svg><div class="boot-progress"><i></i></div></div>
  <script src="/apps.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
